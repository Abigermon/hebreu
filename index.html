<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f2f2f2;
        }

        .menu {
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            display: block;
            width: 250px;
            padding: 15px;
            margin: 15px auto;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
        }

        button:hover {
            background-color: #2254c2bb;
        }
    </style>
</head>

<body>

    <div class="menu">
        <h1>Choisissez une catégorie</h1>

        <button onclick="window.location.href='vocabulaires.html'">
            Vocabulaires
        </button>

        <button onclick="window.location.href='prepositions.html'">
            Prépositions
        </button>
    </div>

</body>
</html>
